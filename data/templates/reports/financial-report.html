<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>التقرير المالي الرسمي</title>
<style>@page{size:{{page_size}};margin:12mm 10mm}*{box-sizing:border-box;print-color-adjust:exact}body{font:12px Tahoma,Arial,sans-serif;color:#14283b;background:#fff}.head{display:flex;justify-content:space-between;border-bottom:3px solid #0d9488;padding-bottom:12px;margin-bottom:18px}h1{font-size:23px;color:#0f766e;margin:0 0 7px}.meta{color:#64748b;line-height:1.8}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:11px}th{background:#0d9488;color:white}td,th{border:1px solid #d8e1e8;padding:7px;text-align:right}tbody tr:nth-child(even){background:#f5faf9}tfoot{font-weight:bold;background:#e8f4f1}.foot{border-top:1px solid #cbd5e1;margin-top:24px;padding-top:8px;color:#64748b;font-size:10px}
@media print { html,body{height:auto;min-height:0;margin:0} .sheet{overflow:visible} thead{display:table-header-group} tfoot{display:table-row-group} tr{break-inside:avoid;page-break-inside:avoid} th,td{overflow-wrap:anywhere} }
</style></head>
<body><div class="head"><div><h1>{{title}}</h1><div>{{subtitle}}</div></div><div class="meta">المنشأة: {{issuer_name}}<br>تاريخ التقرير: {{generated_at}}</div></div>
<div class="stats">{{stats_html}}</div><table><thead><tr>{{headers_html}}</tr></thead><tbody>{{rows_html}}</tbody><tfoot>{{footer_html}}</tfoot></table>
<div class="foot">نظام رصين للفوترة والمحاسبة</div></body></html>
