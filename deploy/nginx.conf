# ==============================================================================
#  Raseen — إعدادات Nginx للإنتاج والنشر السحابي مع شهادة SSL وحماية متقدمة
# ==============================================================================

# إعادة التوجيه التلقائي من HTTP إلى HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zsystem.yourdomain.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zsystem.yourdomain.com;

    # شهادات SSL (مثال عبر Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/zsystem.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zsystem.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ترويسات الأمان (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # الحجم الأقصى للمرفقات والشعارات
    client_max_body_size 16M;

    # ضغط البيانات (Gzip)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # التخزين المؤقت للملفات الثابتة
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2)$ {
        proxy_pass http://127.0.0.1:4711;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # توجيه الطلبات إلى تطبيق Raseen
    location / {
        proxy_pass http://127.0.0.1:4711;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
