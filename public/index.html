<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raseen — نظام الفواتير والمحاسبة</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css?v=1.0.5" />
  <link rel="stylesheet" href="/css/clarity.css?v=4" />
  <link rel="stylesheet" href="/css/print.css" media="print" />
  <!-- تطبيق الثيم قبل رسم الصفحة لتجنب الوميض البصري (FOUC) -->
  <script>
    (function(){
      var t = localStorage.getItem('raseen_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('color-scheme', t);
    })();
  </script>
  <!-- مولد رمز QR (بدون أي اعتماد خارجي) -->
  <script src="/js/vendor/zqr.js"></script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <img class="boot-logo" src="/img/logo.svg" alt="Raseen" width="82" height="82" />
      <div class="boot-text">جارٍ تحميل النظام…</div>
    </div>
  </div>

  <!-- طبقة النوافذ المنبثقة والتنبيهات -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="print-root" class="print-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
